*,*::before,*::after{box-sizing:inherit}

.wrap{max-width:1120px;margin:0 auto;padding:0 16px}
header{position:sticky;top:0;z-index:20;background:rgba(8,20,38,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}

.fl{width:6px;height:22px;border-radius:3px;background:var(--g)}

 nav{display:none;position:absolute;top:64px;left:0;right:0;flex-direction:column;background:var(--bg);padding:10px 16px 16px;border-bottom:1px solid var(--line)}
 nav.open{display:flex}.burger{display:grid;place-items:center}
 .tabs{width:100%}.tabs button{flex:1;padding:9px 6px}
}
.api-note{color:var(--mut)}

.result-card small{display:block;color:var(--mut);margin-top:4px}

.panel-section-title{font-size:16px;margin:22px 0 10px}

function openCompetition(slug,name){if(!slug){panelShell(name,'<p class="panel-note">This competition has no valid SportScore slug.</p>');return}panelShell(name,'<p class="panel-note">Loading official standings from SportScore…</p><div id="competitionData"></div>');getJson('https://sportscore.com/api/widget/standings/?sport=football&slug='+encodeURIComponent(slug)).then(function(data){var el=document.getElementById('competitionData');if(el)el.innerHTML=renderGenericTable(data,'standings')+'<h3 class="panel-section-title">Top scorers</h3><div id="scorersData" class="panel-note">Loading goal leaders…</div>';if(el)getJson('https://sportscore.com/api/widget/topscorers/?sport=football&slug='+encodeURIComponent(slug)+'&limit=10&stat=goals').then(function(x){var t=document.getElementById('scorersData');if(t)t.innerHTML=renderGenericTable(x,'scorers')}).catch(function(){var t=document.getElementById('scorersData');if(t)t.textContent='Top scorers are not available for this competition right now.'})}).catch(function(){var el=document.getElementById('competitionData');if(el)el.innerHTML=panelMessage('Standings are not available right now for this competition.')})}
function openTeam(slug,name){if(!slug){panelShell(name,'<p class="panel-note">This club has no valid SportScore slug.</p>');return}panelShell(name,'<p class="panel-note">Loading team fixtures…</p><div id="teamData"></div>');getJson('https://sportscore.com/api/widget/team/?sport=football&slug='+encodeURIComponent(slug)+'&limit=30').then(function(data){var el=document.getElementById('teamData');if(el)el.innerHTML=renderGenericTable(data,'fixtures')}).catch(function(){var el=document.getElementById('teamData');if(el)el.innerHTML=panelMessage('Team fixtures are not available right now.')})}
function firstValue(o,keys){for(var i=0;i<keys.length;i++){var v=o&&o[keys[i]];if(v!==undefined&&v!==null&&v!=='')return v}return ''}
function displayValue(v){if(v===null||v===undefined||v==='')return '—';if(typeof v==='object')return firstValue(v,['name','title','label','value','short_name'])||'';return String(v)}
function playerCards(list){if(!Array.isArray(list)||!list.length)return '<p class="panel-note">No player list was supplied.</p>';return '<div class="player-grid">'+list.map(function(p){var nm=displayValue(firstValue(p,['name','player','full_name','title']));var no=firstValue(p,['number','shirt_number','shirtNumber']);var pos=firstValue(p,['position','pos']);var rating=firstValue(p,['rating','rate']);var captain=!!firstValue(p,['captain','is_captain']);return '<div class="player-card"><span class="player-no">'+esc(no||'•')+'</span><div class="player-info"><strong>'+esc(nm||'Player')+(captain?' <span class="captain-mark">C</span>':'')+'</strong><small>'+esc(pos||'')+(rating?' · '+esc(rating):'')+'</small></div></div>'}).join('')+'</div>'}
function eventIcon(type){var t=norm(type);if(t.indexOf('goal')!==-1||t.indexOf('penalty scored')!==-1)return '⚽';if(t.indexOf('yellow')!==-1)return '🟨';if(t.indexOf('red')!==-1)return '🟥';if(t.indexOf('sub')!==-1)return '🔄';return '•'}
function eventTable(list,m){if(!Array.isArray(list)||!list.length)return '<p class="panel-note">No event timeline was supplied by the data provider.</p>';var ordered=list.slice().sort(function(a,b){return Number(firstValue(a,['minute','time','elapsed'])||0)-Number(firstValue(b,['minute','time','elapsed'])||0)});return '<div class="timeline">'+ordered.map(function(e){var minute=firstValue(e,['minute','time','elapsed','elapsed_time']);var type=firstValue(e,['type','event','detail','description','incident','subtype']);var player=displayValue(firstValue(e,['player','player_name','name','scorer','player_in']));var playerOut=displayValue(firstValue(e,['player_out','substituted_player','out_player']));var assist=displayValue(firstValue(e,['assist','assisted_by','assist_player']));var teamName=displayValue(firstValue(e,['team','team_name','teamName']));var score=displayValue(firstValue(e,['score','result']));var kind=norm(type);var title=player&&player!=='—'?player:(kind.indexOf('sub')!==-1?'Substitution':'Event');var extra=[];if(playerOut&&playerOut!=='—')extra.push('↓ '+playerOut);if(assist&&assist!=='—')extra.push('Assist: '+assist);if(teamName&&teamName!=='—')extra.push(teamName);if(score&&score!=='—')extra.push(score);return '<div class="timeline-row"><span class="timeline-minute">'+esc(minute?String(minute).replace(/\\s*(min|minutes?)$/i,'')+"'":'—')+'</span><span class="timeline-icon">'+eventIcon(type)+'</span><span class="timeline-text"><strong>'+esc(title)+'</strong><small>'+esc(extra.join(' · ')||type||'')+'</small></span></div>'}).join('')+'</div>'}
function statisticsView(value){var arr=Array.isArray(value)?value:[];if(!arr.length&&value&&typeof value==='object'){var candidate=firstValue(value,['statistics','stats','items','data']);if(Array.isArray(candidate))arr=candidate;else{arr=Object.keys(value).map(function(k){var v=value[k];if(v&&typeof v==='object'&&!Array.isArray(v)){return {name:k,home:firstValue(v,['home','home_value','local']),away:firstValue(v,['away','away_value','visitor'])}}return {name:k,value:displayValue(v)}})}}if(!arr.length)return '<p class="panel-note">Statistics are not available for this match.</p>';return '<div class="stats-list">'+arr.map(function(x){var label=firstValue(x,['name','type','label','statistic','title','key']);var h=firstValue(x,['home','home_value','homeValue','local','team1','value_home']);var a=firstValue(x,['away','away_value','awayValue','visitor','team2','value_away']);if(!label){var keys=Object.keys(x||{}).filter(function(k){return typeof x[k]!=='object'});label=keys.length?prettyKey(keys[0]):'Statistic';}var hv=displayValue(h||firstValue(x,['home_team','homeTeam']));var av=displayValue(a||firstValue(x,['away_team','awayTeam']));return '<div class="stat-row"><span>'+esc(prettyKey(String(label)))+'</span><b>'+esc(hv)+'</b><div class="stat-track"><i></i></div><b>'+esc(av)+'</b></div>'}).join('')+'</div>'}
function openMatch(m){var title=m.home+' vs '+m.away;panelShell(title,'<div id="matchData">'+panelMessage('Loading match information…')+'</div>');if(!m.slug)m.slug=makeMatchSlug(m.home,m.away);if(!m.slug){document.getElementById('matchData').innerHTML=panelMessage('Match details are not available for this fixture.');return}getJson('https://sportscore.com/api/v1/match/?sport=football&slug='+encodeURIComponent(m.slug)).then(function(data){var el=document.getElementById('matchData');if(!el)return;var obj=data.match||data.fixture||data.data||data.result||data;var score=firstValue(obj,['score','result']);var homeScore=firstValue(obj,['home_score','homeScore']);var awayScore=firstValue(obj,['away_score','awayScore']);if(score&&typeof score==='object'){homeScore=firstValue(score,['home','home_score']);awayScore=firstValue(score,['away','away_score'])}if(homeScore===''&&awayScore===''){homeScore=m.hs===null?'—':m.hs;awayScore=m.as===null?'—':m.as}var when=firstValue(obj,['datetime','start_time','startTime','time','date','kickoff'])||m.rawTime;var venue=firstValue(obj,['venue','stadium','ground']);var referee=firstValue(obj,['referee','official']);var city=firstValue(obj,['city','venue_city']);var statusText=firstValue(obj,['status_text','status','state'])||m.status.label;var events=firstValue(obj,['events','timeline','incidents']);var lineups=firstValue(obj,['lineups','formations','players']);var stats=firstValue(obj,['statistics','stats','match_statistics']);var finished=m.status.kind==='finished';var live=m.status.kind==='live';var bits='<section class="match-hero"><div class="match-comp">'+esc(m.competition)+'</div><div class="match-scoreline"><div class="match-side">'+crest(m.home)+'<strong>'+esc(m.home)+'</strong></div><div class="match-center"><div class="match-score">'+esc(homeScore)+' <i>–</i> '+esc(awayScore)+'</div><span class="match-status '+(live?'is-live':'')+'">'+esc(statusText)+'</span><small>'+esc(iraqDate(when)||m.time||'')+' · Baghdad</small></div><div class="match-side">'+crest(m.away)+'<strong>'+esc(m.away)+'</strong></div></div></section>';bits+='<div class="match-tabs"><a href="#match-events">Events</a><a href="#match-lineups">Lineups</a><a href="#match-stats">Statistics</a></div>';bits+='<section id="match-events"><h3 class="panel-section-title">Match timeline</h3>'+(events?eventTable(events,m):'<p class="panel-note">'+(finished?'The provider has not supplied the event timeline for this match.':live?'Match events will appear here as the provider publishes them.':'Events will appear here when the match begins.')+'</p>')+'</section>';if(lineups&&typeof lineups==='object'){bits+='<section id="match-lineups"><h3 class="panel-section-title">Lineups</h3>';var hf=firstValue(lineups,['home_formation','homeFormation','formation_home']),af=firstValue(lineups,['away_formation','awayFormation','formation_away']);if(hf||af)bits+='<div class="detail-grid"><div class="detail-box"><small>'+esc(m.home)+' formation</small><strong>'+esc(displayValue(hf)||'—')+'</strong></div><div class="detail-box"><small>'+esc(m.away)+' formation</small><strong>'+esc(displayValue(af)||'—')+'</strong></div></div>';var hxi=firstValue(lineups,['home_xi','homeXi','home_starting_eleven','home_starting_lineup']),axi=firstValue(lineups,['away_xi','awayXi','away_starting_eleven','away_starting_lineup']),hs=firstValue(lineups,['home_subs','homeSubs','home_substitutes']),as=firstValue(lineups,['away_subs','awaySubs','away_substitutes']);if(hxi)bits+='<h4 class="panel-section-title">'+esc(m.home)+' · Starting XI</h4>'+playerCards(hxi);if(axi)bits+='<h4 class="panel-section-title">'+esc(m.away)+' · Starting XI</h4>'+playerCards(axi);if(hs)bits+='<h4 class="panel-section-title">'+esc(m.home)+' · Substitutes</h4>'+playerCards(hs);if(as)bits+='<h4 class="panel-section-title">'+esc(m.away)+' · Substitutes</h4>'+playerCards(as);bits+='</section>'}else{bits+='<section id="match-lineups"><h3 class="panel-section-title">Lineups</h3><p class="panel-note">'+(m.status.kind==='upcoming'?'Confirmed lineups will appear when published by the provider.':'Lineup information was not supplied by the provider.')+'</p></section>'}if(stats)bits+='<section id="match-stats"><h3 class="panel-section-title">Match statistics</h3>'+statisticsView(stats)+'</section>';if(venue||city||referee)bits+='<section><h3 class="panel-section-title">Match information</h3><div class="detail-grid">'+[['Stadium',venue],['City',city],['Referee',referee]].filter(function(x){return x[1]}).map(function(x){return '<div class="detail-box"><small>'+x[0]+'</small><strong>'+esc(displayValue(x[1]))+'</strong></div>'}).join('')+'</div></section>';el.innerHTML=bits}).catch(function(){var el=document.getElementById('matchData');if(el)el.innerHTML=panelMessage('Match details are temporarily unavailable. Please try again.')})}
function newsPanel(){panelShell('Football News','<div class="news-toolbar"><p class="panel-note">Latest football news · Updated from live news feeds</p><button class="action" id="refreshNews">Refresh news</button></div><div id="newsData">'+panelMessage('Loading latest football news…')+'</div>');function loadNews(){var el=document.getElementById('newsData');if(!el)return;el.innerHTML=panelMessage('Checking for the latest headlines…');var day=new Date().toISOString().slice(0,10);var queries=['football OR soccer after:'+day,'Premier League OR Champions League OR La Liga football after:'+day,'Iraq football OR Asian football OR international football after:'+day];var feeds=queries.map(function(q){var feed='https://news.google.com/rss/search?q='+encodeURIComponent(q)+'&hl=en-US&gl=US&ceid=US:en';return getJson('https://api.rss2json.com/v1/api.json?rss_url='+encodeURIComponent(feed)+'&_='+Date.now()).then(function(d){return d.items||[]}).catch(function(){return []})});Promise.all(feeds).then(function(groups){var all=[],seen={};groups.forEach(function(a){a.forEach(function(x){var key=norm(x.title||'');if(!key||seen[key])return;seen[key]=true;var date=new Date(x.pubDate||0);if(!isNaN(date.getTime())&&Date.now()-date.getTime()>72*60*60*1000)return;all.push(x)})});all.sort(function(a,b){return new Date(b.pubDate||0)-new Date(a.pubDate||0)});var target=document.getElementById('newsData');if(!target)return;if(!all.length){target.innerHTML=panelMessage('No recent headlines were returned. Try refreshing later.');return}target.innerHTML='<div class="news-updated">Latest items · '+new Date().toLocaleString()+'</div><div class="result-list">'+all.slice(0,30).map(function(x){return '<a class="article" href="'+esc(x.link)+'" target="_blank" rel="noopener noreferrer"><strong>'+esc(x.title)+'</strong><small>'+esc(x.author||'News source')+' · '+esc(x.pubDate||'')+'</small></a>'}).join('')+'</div>'}).catch(function(){var target=document.getElementById('newsData');if(target)target.innerHTML=panelMessage('The news feeds are temporarily unavailable.')})}loadNews();var refresh=document.getElementById('refreshNews');if(refresh)refresh.onclick=loadNews}
function openFavorites(){var a=favoriteStore();panelShell('Your Favorites',a.length?'<p class="panel-note">Saved on this device only.</p><div class="result-list">'+a.map(function(x){return '<div class="result-card"><div class="grow"><strong>'+esc(x.name)+'</strong><small>'+esc(x.kind)+' · '+esc(x.meta||'')+'</small></div><button data-open-kind="'+esc(x.kind)+'" data-slug="'+esc(x.slug)+'" data-name="'+esc(x.name)+'">Open</button><button data-fav="'+esc(x.kind)+'" data-slug="'+esc(x.slug)+'" data-name="'+esc(x.name)+'">Remove</button></div>'}).join('')+'</div>':panelMessage('You have not saved any teams or competitions yet. Search and tap ☆ Save to add favorites.'))}
function showPanel(name){if(name==='tables'||name==='teams'||name==='search'){searchPanel(name);return}if(name==='news'){newsPanel();return}if(name==='favorites'){openFavorites();return}if(name==='fixtures'){panelShell('Fixtures','<p class="panel-note">Use the date selector on the main Scores screen to browse yesterday, today and tomorrow. Select any match to open its details.</p><button class="action" id="goScores">Back to scores</button>');var b=document.getElementById('goScores');if(b)b.onclick=closePanel;return}}
document.addEventListener('click',function(e){var nav=e.target.closest&&e.target.closest('[data-panel]');if(nav){e.preventDefault();showPanel(nav.getAttribute('data-panel'));return}var compBtn=e.target.closest&&e.target.closest('[data-comp]');if(compBtn){openCompetition(compBtn.getAttribute('data-comp'),compBtn.getAttribute('data-name'));return}var teamBtn=e.target.closest&&e.target.closest('[data-team]');if(teamBtn){openTeam(teamBtn.getAttribute('data-team'),teamBtn.getAttribute('data-name'));return}var quick=e.target.closest&&e.target.closest('[data-q]');if(quick){var inp=document.getElementById('scorelyQuery');if(inp){inp.value=quick.getAttribute('data-q');searchResults(inp.value)}return}var fav=e.target.closest&&e.target.closest('[data-fav]');if(fav){var item={kind:fav.getAttribute('data-fav'),slug:fav.getAttribute('data-slug'),name:fav.getAttribute('data-name'),meta:fav.getAttribute('data-meta')||''};saveFavorite(item);if(scorelyPanel&&scorelyPanel.querySelector('.panel-title')&&scorelyPanel.querySelector('.panel-title').textContent==='Your Favorites')openFavorites();else fav.textContent=favoriteStore().some(function(x){return x.kind+':'+x.slug===item.kind+':'+item.slug})?'★ Saved':'☆ Save';return}var op=e.target.closest&&e.target.closest('[data-open-kind]');if(op){var k=op.getAttribute('data-open-kind'),slug=op.getAttribute('data-slug'),name=op.getAttribute('data-name');if(k==='team')openTeam(slug,name);else if(k==='competition')openCompetition(slug,name);else panelShell(name,'<p class="panel-note">Player profile data can be added when the provider returns a player slug.</p>');return}var match=e.target.closest&&e.target.closest('[data-match]');if(match){var id=match.getAttribute('data-match');var m=(cache[selected]||[]).find(function(x,i){return selected+x.league.id+i===id});if(m)openMatch(m)}});
document.addEventListener('submit',function(e){if(e.target&&e.target.id==='scorelySearchForm'){e.preventDefault();var q=document.getElementById('scorelyQuery').value.trim();if(q.length>=2)searchResults(q)}});

window.addEventListener('error',function(e){root.innerHTML='<main class="wrap"><div class="empty">SCORELY could not start: '+esc(e.message||'JavaScript error')+'</div></main>'});
render();load();setInterval(load,60000);
})();
