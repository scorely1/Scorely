<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SCORELY – Every Match. Every Moment.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,400;0,600;0,700;1,800&display=swap" rel="stylesheet">
<style>
:root{--bg:#081426;--bg2:#0d1d36;--card:#10223d;--line:#1d3558;--tx:#fff;--mut:#8da2c0;--g:#55e61c;--gd:#2f9e0c;--red:#ff4d4d;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Archivo,"Helvetica Neue",Arial,sans-serif;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,a:focus-visible{outline:2px solid var(--g);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding:0 16px}
header{position:sticky;top:0;z-index:20;background:rgba(8,20,38,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hb{display:flex;align-items:center;gap:20px;height:64px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--tx)}
.logo b{font-style:italic;font-weight:800;font-size:25px;letter-spacing:.5px}
nav{display:flex;gap:4px;margin-left:auto}
nav a{color:var(--mut);text-decoration:none;font-weight:600;font-size:14px;padding:8px 12px;border-radius:8px}
nav a:hover,nav a.on{color:var(--tx);background:var(--card)}
nav a.on{box-shadow:inset 0 -2px 0 var(--g)}
.burger{display:none;margin-left:auto;width:40px;height:40px;border-radius:8px;border:1px solid var(--line)}
.hero{padding:34px 0 22px}
.hero h1{margin:0;font-style:italic;font-weight:800;font-size:clamp(34px,7vw,64px);line-height:1;letter-spacing:-.5px}
.hero p{margin:10px 0 0;color:var(--mut);max-width:48ch;line-height:1.5}
.sh{display:flex;align-items:center;gap:10px;margin:26px 0 12px}
.sh h2{margin:0;font-size:18px;font-weight:700}
.dot{width:9px;height:9px;border-radius:50%;background:var(--red);animation:p 1.4s infinite}
@keyframes p{50%{opacity:.25}}
@media(prefers-reduced-motion:reduce){.dot{animation:none}}
.live{display:flex;gap:12px;overflow-x:auto;padding-bottom:8px;scroll-snap-type:x proximity}
.lc{flex:0 0 280px;scroll-snap-align:start;background:linear-gradient(160deg,#143056,var(--card));border:1px solid var(--line);border-top:3px solid var(--g);border-radius:12px;padding:14px}
.lc small{color:var(--mut);font-size:12px}
.lt{display:flex;align-items:center;justify-content:space-between;margin-top:10px;gap:8px}
.lt span{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px}
.lt b{font-size:22px;font-weight:800}
.min{color:var(--g);font-weight:700;font-size:12px}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0 14px}
.tabs{display:flex;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px}
.tabs button{padding:9px 16px;border-radius:9px;font-weight:700;font-size:14px;color:var(--mut);text-align:center}
.tabs button small{display:block;font-weight:400;font-size:11px}
.tabs button.on{background:var(--g);color:#06210a}
.chips{display:flex;gap:8px;overflow-x:auto;width:100%;padding:2px 0 6px}
.chip{flex:none;padding:7px 14px;border-radius:99px;border:1px solid var(--line);color:var(--mut);font-size:13px;font-weight:600;white-space:nowrap}
.chip.on{border-color:var(--g);color:var(--g);background:rgba(85,230,28,.08)}
.grid{display:grid;gap:16px;grid-template-columns:1fr}
@media(min-width:860px){.grid{grid-template-columns:1fr 1fr}}
.lg{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.lh{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--bg2);border-bottom:1px solid var(--line)}
.lh b{font-size:15px}.lh small{color:var(--mut);font-size:12px;margin-left:auto}
.fl{width:6px;height:22px;border-radius:3px;background:var(--g)}
.m{display:grid;grid-template-columns:58px 1fr 34px;align-items:center;gap:8px;padding:11px 14px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.m:last-child{border-bottom:0}
.m:hover{background:rgba(255,255,255,.03)}
.st{font-size:12px;font-weight:700;color:var(--mut)}
.st.l{color:var(--g)}
.tm{display:flex;flex-direction:column;gap:7px}
.tm div{display:flex;align-items:center;gap:9px;font-size:14px;font-weight:600}
.cr{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:8px;font-weight:700;color:#fff;flex:none}
.sc{display:flex;flex-direction:column;gap:7px;text-align:right;font-weight:800;font-size:15px}
.w{color:var(--tx)}.lo{color:var(--mut);font-weight:600}
.empty{padding:40px 16px;text-align:center;color:var(--mut);border:1px dashed var(--line);border-radius:14px}
.det{grid-column:1/-1;padding:10px 14px 14px 80px;color:var(--mut);font-size:13px;background:var(--bg2);border-bottom:1px solid var(--line)}
footer{margin-top:40px;border-top:1px solid var(--line);padding:24px 0 32px;color:var(--mut);font-size:13px}
footer .wrap{display:flex;gap:12px;justify-content:space-between;flex-wrap:wrap;align-items:center}
@media(max-width:720px){
 nav{display:none;position:absolute;top:64px;left:0;right:0;flex-direction:column;background:var(--bg);padding:10px 16px 16px;border-bottom:1px solid var(--line)}
 nav.open{display:flex}.burger{display:grid;place-items:center}
 .tabs{width:100%}.tabs button{flex:1;padding:9px 6px}
}
.api-note{color:var(--mut)}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script>
(function(){
var root=document.getElementById('root'), API='https://sportscore.com/api/v1/fixtures/?sport=football&limit=200';
var days=[{id:'y',label:'Yesterday',off:-1},{id:'t',label:'Today',off:0},{id:'n',label:'Tomorrow',off:1}];
var leagues=[{id:'epl',name:'Premier League',country:'England',keys:['premier league']},{id:'liga',name:'La Liga',country:'Spain',keys:['la liga','laliga']},{id:'sa',name:'Serie A',country:'Italy',keys:['serie a']},{id:'bl',name:'Bundesliga',country:'Germany',keys:['bundesliga']},{id:'l1',name:'Ligue 1',country:'France',keys:['ligue 1','ligue1']},{id:'ucl',name:'Champions League',country:'Europe',keys:['champions league']}];
var selected='t',filter='all',openId='',cache={},loading=true,failed=false;
function dateAt(n){var d=new Date();d.setUTCHours(12,0,0,0);d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)}
function dateLabel(n){return new Date(dateAt(n)+'T12:00:00Z').toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short',timeZone:'UTC'})}
function esc(v){return String(v==null?'':v).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function norm(v){return String(v||'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim()}
function team(v){return typeof v==='string'?v:(v&&typeof v==='object'?(v.name||v.title||v.short_name||'TBD'):'TBD')}
function num(v){if(v===null||v===undefined||v==='')return null;var n=Number(v);return Number.isFinite(n)?n:null}
function comp(m){var c=m.competition||m.league||m.tournament||m.competition_name||m.league_name||'Other competitions';return typeof c==='object'?(c.name||c.title||c.slug||'Other competitions'):String(c)}
function league(name){var q=norm(name);for(var i=0;i<leagues.length;i++){if(leagues[i].keys.some(function(k){return q.indexOf(k)!==-1}))return leagues[i]}return {id:'other-'+q.replace(/\s+/g,'-'),name:name||'Other competitions',country:'Football'}}
function status(m){var s=norm(m.status||m.state||''),t=String(m.status_text||m.statusText||m.minute||'');if(['live','in play','1h','2h','ht','half time','extra time','penalties'].indexOf(s)!==-1||s.indexOf('live')!==-1)return {kind:'live',label:t||(s==='ht'?'HT':'LIVE')};if(['finished','ft','full time','aet','pens'].indexOf(s)!==-1)return {kind:'finished',label:t||'FT'};if(s.indexOf('postpon')!==-1)return {kind:'other',label:'Postponed'};if(s.indexOf('cancel')!==-1)return {kind:'other',label:'Cancelled'};return {kind:'upcoming',label:t}}
function normalize(m){if(!m||typeof m!=='object')return null;var home=team(m.home||m.home_team||m.homeTeam),away=team(m.away||m.away_team||m.awayTeam);if(home==='TBD'&&away==='TBD')return null;var raw=m.time||m.date||m.datetime||m.kickoff||m.start_time||m.startTime,dt=raw?new Date(raw):null;return {home:home,away:away,hs:num(m.home_score!==undefined?m.home_score:(m.homeScore!==undefined?m.homeScore:(m.home&&m.home.score))),as:num(m.away_score!==undefined?m.away_score:(m.awayScore!==undefined?m.awayScore:(m.away&&m.away.score))),status:status(m),competition:comp(m),league:league(comp(m)),time:dt&&!isNaN(dt.getTime())?dt.toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'}):''}}
function rows(json){if(Array.isArray(json))return json;if(!json||typeof json!=='object')return [];return json.matches||json.fixtures||json.results||json.data||json.events||[]}
function crest(name){var x=0;for(var i=0;i<name.length;i++)x=(x*31+name.charCodeAt(i))%360;return '<span class="cr" style="background:hsl('+x+',45%,36%)">'+esc(name.replace(/[^A-Za-z ]/g,'').slice(0,3).toUpperCase())+'</span>'}
function matchCard(m,id){var played=m.hs!==null&&m.as!==null,homeWin=played&&m.hs>m.as,awayWin=played&&m.as>m.hs;return '<button class="m" data-match="'+esc(id)+'" aria-expanded="'+(openId===id)+'"><span class="st '+(m.status.kind==='live'?'l':'')+'">'+esc(m.status.label||m.time||'—')+'</span><span class="tm"><div>'+crest(m.home)+'<span class="'+(homeWin||!played?'w':'lo')+'">'+esc(m.home)+'</span></div><div>'+crest(m.away)+'<span class="'+(awayWin||!played?'w':'lo')+'">'+esc(m.away)+'</span></div></span><span class="sc"><span class="'+(homeWin?'w':'lo')+'">'+(played?m.hs:'–')+'</span><span class="'+(awayWin?'w':'lo')+'">'+(played?m.as:'–')+'</span></span></button>'+(openId===id?'<div class="det">'+(m.status.kind==='live'?'Live match · data supplied by SportScore.':m.status.kind==='finished'?'Full time · final score supplied by SportScore.':'Kickoff '+esc(m.time||'time not available')+'.')+'</div>':'')}
function render(){var all=[];days.forEach(function(d){(cache[d.id]||[]).forEach(function(m){if(m.status.kind==='live')all.push(m)})});var live=all.length?'<div class="live">'+all.map(function(m,i){return '<div class="lc"><div style="display:flex;justify-content:space-between"><small>'+esc(m.competition)+'</small><span class="min">'+esc(m.status.label||'LIVE')+'</span></div><div class="lt"><span>'+crest(m.home)+esc(m.home)+'</span><b>'+(m.hs===null?'–':m.hs)+'</b></div><div class="lt"><span>'+crest(m.away)+esc(m.away)+'</span><b>'+(m.as===null?'–':m.as)+'</b></div></div>'}).join('')+'</div>':'<div class="empty">'+(loading?'Checking live matches…':'No live matches reported right now.')+'</div>';
var matches=cache[selected]||[],groups={};matches.forEach(function(m){if(filter==='all'||filter===m.league.id){var id=m.league.id;if(!groups[id])groups[id]={league:m.league,matches:[]};groups[id].matches.push(m)}});
var cards=Object.keys(groups).sort(function(a,b){return groups[a].league.name.localeCompare(groups[b].league.name)}).map(function(id){var g=groups[id];return '<section class="lg"><div class="lh"><span class="fl"></span><b>'+esc(g.league.name)+'</b><small>'+esc(g.league.country)+'</small></div>'+g.matches.map(function(m,i){return matchCard(m,selected+id+i)}).join('')+'</section>'}).join('');
var filterIds=[{id:'all',name:'All leagues'}];leagues.forEach(function(l){if(matches.some(function(m){return m.league.id===l.id}))filterIds.push({id:l.id,name:l.name})});
root.innerHTML='<header><div class="wrap hb"><a class="logo" href="#top"><b>SCORELY</b></a><button class="burger" id="burger">☰</button><nav id="nav"><a class="on" href="#scores">Scores</a><a href="#fixtures">Fixtures</a><a href="#tables">Tables</a><a href="#news">News</a><a href="#teams">Teams</a></nav></div></header><main class="wrap" id="scores"><section class="hero"><h1>Every Match. Every Moment.</h1><p>Live scores, fixtures and results from the biggest leagues in world football.</p></section><section><div class="sh"><span class="dot"></span><h2>Live now</h2><small style="color:var(--mut)">'+all.length+' matches</small></div>'+live+'</section><section class="sh" style="margin-top:30px"><h2>Matches</h2><small style="color:var(--mut);margin-left:auto">Data refreshes every 60 seconds</small></section><div class="bar"><div class="tabs">'+days.map(function(d){return '<button data-day="'+d.id+'" class="'+(selected===d.id?'on':'')+'">'+d.label+'<small>'+dateLabel(d.off)+'</small></button>'}).join('')+'</div><div class="chips">'+filterIds.map(function(l){return '<button data-filter="'+l.id+'" class="chip '+(filter===l.id?'on':'')+'">'+esc(l.name)+'</button>'}).join('')+'</div></div>'+(failed?'<div class="empty">Could not load fixtures from SportScore. Please try again shortly.<br><button class="chip on" id="retry">Retry</button></div>':loading&&!cache[selected]?'<div class="empty">Loading real fixtures…</div>':cards||'<div class="empty">No matches found for this date or league. Choose another day.</div>')+'</main><footer><div class="wrap"><span>SCORELY · Every Match. Every Moment.</span><a href="https://sportscore.com/" target="_blank" rel="noopener noreferrer" style="color:var(--mut)">Powered by SportScore</a></div></footer>';
document.getElementById('burger').onclick=function(){document.getElementById('nav').classList.toggle('open')};
Array.prototype.forEach.call(document.querySelectorAll('[data-day]'),function(el){el.onclick=function(){selected=el.getAttribute('data-day');filter='all';openId='';render()}});
Array.prototype.forEach.call(document.querySelectorAll('[data-filter]'),function(el){el.onclick=function(){filter=el.getAttribute('data-filter');render()}});
Array.prototype.forEach.call(document.querySelectorAll('[data-match]'),function(el){el.onclick=function(){var id=el.getAttribute('data-match');openId=openId===id?'':id;render()}});
var retry=document.getElementById('retry');if(retry)retry.onclick=load;
}
function load(){loading=true;failed=false;render();Promise.all(days.map(function(d){return fetch(API+'&date='+encodeURIComponent(dateAt(d.off)),{headers:{Accept:'application/json'}}).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}).then(function(j){var a=rows(j);if(!Array.isArray(a))throw new Error('Invalid response');return {id:d.id,matches:a.map(normalize).filter(Boolean)}})})).then(function(result){result.forEach(function(x){cache[x.id]=x.matches});loading=false;failed=false;render()}).catch(function(err){console.error('SCORELY API:',err);loading=false;failed=true;render()})}
window.addEventListener('error',function(e){root.innerHTML='<main class="wrap"><div class="empty">SCORELY could not start: '+esc(e.message||'JavaScript error')+'</div></main>'});
render();load();setInterval(load,60000);
})();
</script>
</body>
</html>
