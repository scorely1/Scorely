<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SCORELY – Every Match. Every Moment.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,400;0,600;0,700;1,800&display=swap" rel="stylesheet">
<style>
:root{--bg:#081426;--bg2:#0d1d36;--card:#10223d;--line:#1d3558;--tx:#fff;--mut:#8da2c0;--g:#55e61c;--gd:#2f9e0c;--red:#ff4d4d;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Archivo,"Helvetica Neue",Arial,sans-serif;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,a:focus-visible{outline:2px solid var(--g);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding:0 16px}
header{position:sticky;top:0;z-index:20;background:rgba(8,20,38,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hb{display:flex;align-items:center;gap:20px;height:64px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--tx)}
.logo b{font-style:italic;font-weight:800;font-size:25px;letter-spacing:.5px}
nav{display:flex;gap:4px;margin-left:auto}
nav a{color:var(--mut);text-decoration:none;font-weight:600;font-size:14px;padding:8px 12px;border-radius:8px}
nav a:hover,nav a.on{color:var(--tx);background:var(--card)}
nav a.on{box-shadow:inset 0 -2px 0 var(--g)}
.burger{display:none;margin-left:auto;width:40px;height:40px;border-radius:8px;border:1px solid var(--line)}
.hero{padding:34px 0 22px}
.hero h1{margin:0;font-style:italic;font-weight:800;font-size:clamp(34px,7vw,64px);line-height:1;letter-spacing:-.5px}
.hero p{margin:10px 0 0;color:var(--mut);max-width:48ch;line-height:1.5}
.sh{display:flex;align-items:center;gap:10px;margin:26px 0 12px}
.sh h2{margin:0;font-size:18px;font-weight:700}
.dot{width:9px;height:9px;border-radius:50%;background:var(--red);animation:p 1.4s infinite}
@keyframes p{50%{opacity:.25}}
@media(prefers-reduced-motion:reduce){.dot{animation:none}}
.live{display:flex;gap:12px;overflow-x:auto;padding-bottom:8px;scroll-snap-type:x proximity}
.lc{flex:0 0 280px;scroll-snap-align:start;background:linear-gradient(160deg,#143056,var(--card));border:1px solid var(--line);border-top:3px solid var(--g);border-radius:12px;padding:14px}
.lc small{color:var(--mut);font-size:12px}
.lt{display:flex;align-items:center;justify-content:space-between;margin-top:10px;gap:8px}
.lt span{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px}
.lt b{font-size:22px;font-weight:800}
.min{color:var(--g);font-weight:700;font-size:12px}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0 14px}
.tabs{display:flex;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px}
.tabs button{padding:9px 16px;border-radius:9px;font-weight:700;font-size:14px;color:var(--mut);text-align:center}
.tabs button small{display:block;font-weight:400;font-size:11px}
.tabs button.on{background:var(--g);color:#06210a}
.chips{display:flex;gap:8px;overflow-x:auto;width:100%;padding:2px 0 6px}
.chip{flex:none;padding:7px 14px;border-radius:99px;border:1px solid var(--line);color:var(--mut);font-size:13px;font-weight:600;white-space:nowrap}
.chip.on{border-color:var(--g);color:var(--g);background:rgba(85,230,28,.08)}
.grid{display:grid;gap:16px;grid-template-columns:1fr}
@media(min-width:860px){.grid{grid-template-columns:1fr 1fr}}
.lg{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.lh{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--bg2);border-bottom:1px solid var(--line)}
.lh b{font-size:15px}.lh small{color:var(--mut);font-size:12px;margin-left:auto}
.fl{width:6px;height:22px;border-radius:3px;background:var(--g)}
.m{display:grid;grid-template-columns:58px 1fr 34px;align-items:center;gap:8px;padding:11px 14px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.m:last-child{border-bottom:0}
.m:hover{background:rgba(255,255,255,.03)}
.st{font-size:12px;font-weight:700;color:var(--mut)}
.st.l{color:var(--g)}
.tm{display:flex;flex-direction:column;gap:7px}
.tm div{display:flex;align-items:center;gap:9px;font-size:14px;font-weight:600}
.cr{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:8px;font-weight:700;color:#fff;flex:none}
.sc{display:flex;flex-direction:column;gap:7px;text-align:right;font-weight:800;font-size:15px}
.w{color:var(--tx)}.lo{color:var(--mut);font-weight:600}
.empty{padding:40px 16px;text-align:center;color:var(--mut);border:1px dashed var(--line);border-radius:14px}
.det{grid-column:1/-1;padding:10px 14px 14px 80px;color:var(--mut);font-size:13px;background:var(--bg2);border-bottom:1px solid var(--line)}
footer{margin-top:40px;border-top:1px solid var(--line);padding:24px 0 32px;color:var(--mut);font-size:13px}
footer .wrap{display:flex;gap:12px;justify-content:space-between;flex-wrap:wrap;align-items:center}
@media(max-width:720px){
 nav{display:none;position:absolute;top:64px;left:0;right:0;flex-direction:column;background:var(--bg);padding:10px 16px 16px;border-bottom:1px solid var(--line)}
 nav.open{display:flex}.burger{display:grid;place-items:center}
 .tabs{width:100%}.tabs button{flex:1;padding:9px 6px}
}
.api-note{color:var(--mut)}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script>

(function(){
var h=React.createElement,useState=React.useState,useEffect=React.useEffect;
var API='https://sportscore.com/api/v1/fixtures/?sport=football&limit=200';
var LEAGUES=[
{id:'epl',n:'Premier League',c:'England',keys:['premier league','english premier league']},
{id:'liga',n:'La Liga',c:'Spain',keys:['la liga','laliga','primera division']},
{id:'sa',n:'Serie A',c:'Italy',keys:['serie a','italian serie a']},
{id:'bl',n:'Bundesliga',c:'Germany',keys:['bundesliga','german bundesliga']},
{id:'l1',n:'Ligue 1',c:'France',keys:['ligue 1','ligue1']},
{id:'ucl',n:'Champions League',c:'Europe',keys:['champions league','uefa champions league']}
];
function utcDate(offset){var d=new Date();d.setUTCHours(12,0,0,0);d.setUTCDate(d.getUTCDate()+offset);return d.toISOString().slice(0,10)}
function dateLabel(offset){var d=new Date(utcDate(offset)+'T12:00:00Z');return d.toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short',timeZone:'UTC'})}
var DAYS=[{id:'y',label:'Yesterday',offset:-1},{id:'t',label:'Today',offset:0},{id:'n',label:'Tomorrow',offset:1}];
function norm(v){return String(v==null?'':v).toLowerCase().replace(/[^a-z0-9]+/g,' ').trim()}
function teamName(v){if(typeof v==='string')return v;if(v&&typeof v==='object')return v.name||v.title||v.short_name||v.shortName||'TBD';return 'TBD'}
function score(v){if(v===null||v===undefined||v==='')return null;var n=Number(v);return Number.isFinite(n)?n:null}
function compName(m){var c=m.competition||m.league||m.tournament||m.competition_name||m.league_name||'';if(c&&typeof c==='object')c=c.name||c.title||c.slug||'';return String(c||'Other competitions')}
function leagueFor(name){var q=norm(name);for(var i=0;i<LEAGUES.length;i++){if(LEAGUES[i].keys.some(function(k){return q.indexOf(norm(k))!==-1||norm(k).indexOf(q)!==-1&&q.length>5}))return LEAGUES[i]}return {id:'other-'+q.replace(/\s+/g,'-'),n:name||'Other competitions',c:'Football'}}
function matchStatus(m){
 var s=norm(m.status||m.state||'');
 var t=String(m.status_text||m.statusText||m.minute||'');
 if(s.indexOf('live')!==-1||s==='in play'||s==='1h'||s==='2h'||s==='ht'||s==='half time'||s==='extra time'||s==='penalties')return {kind:'live',label:t|| (s==='ht'?'HT':'LIVE')};
 if(s==='ht'||s.indexOf('half time')!==-1)return {kind:'live',label:'HT'};
 if(s==='finished'||s==='ft'||s==='full time'||s==='aet'||s==='pens'||s==='after extra time')return {kind:'finished',label:t||'FT'};
 if(s.indexOf('postpon')!==-1)return {kind:'other',label:'Postponed'};
 if(s.indexOf('cancel')!==-1)return {kind:'other',label:'Cancelled'};
 if(s.indexOf('abandon')!==-1)return {kind:'other',label:'Abandoned'};
 return {kind:'upcoming',label:t||''};
}
function kickoff(m){
 var raw=m.time||m.date||m.datetime||m.kickoff||m.start_time||m.startTime;
 if(!raw)return '';
 var d=new Date(raw);if(Number.isNaN(d.getTime()))return '';
 return d.toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'});
}
function normalizeMatch(m){
 if(!m||typeof m!=='object')return null;
 var home=teamName(m.home||m.home_team||m.homeTeam),away=teamName(m.away||m.away_team||m.awayTeam);
 if(home==='TBD'&&away==='TBD')return null;
 var hs=score(m.home_score!==undefined?m.home_score:(m.homeScore!==undefined?m.homeScore:(m.home&&m.home.score)));
 var as=score(m.away_score!==undefined?m.away_score:(m.awayScore!==undefined?m.awayScore:(m.away&&m.away.score)));
 var st=matchStatus(m),comp=compName(m);
 return {home:home,away:away,hs:hs,as:as,status:st,competition:comp,league:leagueFor(comp),time:kickoff(m),slug:m.slug||'',homeLogo:m.home_logo||'',awayLogo:m.away_logo||'',raw:m};
}
function extract(payload){
 if(Array.isArray(payload))return payload;
 if(!payload||typeof payload!=='object')return [];
 return payload.matches||payload.fixtures||payload.results||payload.data||payload.events||[];
}
function hue(s){var x=0;for(var i=0;i<s.length;i++)x=(x*31+s.charCodeAt(i))%360;return x}
function Crest(p){return h('span',{className:'cr',style:{background:'hsl('+hue(p.n)+',45%,36%)'},'aria-hidden':'true'},p.n.replace(/[^A-Za-z ]/g,'').slice(0,3).toUpperCase())}
function Logo(){return h('a',{className:'logo',href:'#top','aria-label':'SCORELY home'},
 h('svg',{width:44,height:40,viewBox:'0 0 44 40','aria-hidden':'true'},h('g',{fill:'none',stroke:'#55e61c',strokeWidth:2.2,strokeLinecap:'round',strokeLinejoin:'round'},h('circle',{cx:35,cy:7,r:5.5}),h('path',{d:'M31 11C28 13 26 15 24 17'}),h('path',{d:'M14 8c2-2 4-1 4 1l-1 4 5 2 4-2'}),h('path',{d:'M17 13l-3 8 4 4-3 9'}),h('path',{d:'M14 21l-4 7M18 25l7 4 2 8'}),h('path',{d:'M6 15l8-2'}),h('path',{d:'M18 17l9 -3',strokeWidth:3}))),h('b',null,'SCORELY'))}
function Status(p){var s=p.m.status;return h('span',{className:'st'+(s.kind==='live'?' l':'')},s.label||p.m.time||'—')}
function Match(p){
 var m=p.m,played=m.hs!==null&&m.as!==null,hw=played&&m.hs>m.as,aw=played&&m.as>m.hs;
 var detail=p.open?h('div',{className:'det'},m.status.kind==='live'?'Live match · scores and status are supplied by SportScore.':m.status.kind==='finished'?'Full time · final score supplied by SportScore.':(m.time?'Kickoff '+m.time+' (your local time).':'Match schedule supplied by SportScore.')):null;
 return h(React.Fragment,null,h('button',{className:'m','aria-expanded':!!p.open,onClick:p.onClick},
 h(Status,{m:m}),h('span',{className:'tm'},h('div',null,h(Crest,{n:m.home}),h('span',{className:hw||!played?'w':'lo'},m.home)),h('div',null,h(Crest,{n:m.away}),h('span',{className:aw||!played?'w':'lo'},m.away))),
 h('span',{className:'sc'},h('span',{className:hw?'w':'lo'},played?m.hs:'–'),h('span',{className:aw?'w':'lo'},played?m.as:'–'))),detail)
}
function App(){
 var a=useState('t'),day=a[0],setDay=a[1];
 var b=useState('all'),filter=b[0],setFilter=b[1];
 var c=useState(null),open=c[0],setOpen=c[1];
 var d=useState(false),menu=d[0],setMenu=d[1];
 var e=useState({}),data=e[0],setData=e[1];
 var f=useState(false),loading=f[0],setLoading=f[1];
 var g=useState(''),error=g[0],setError=g[1];
 var matches=data[day]||[];
 var liveList=[];
 DAYS.forEach(function(di){(data[di.id]||[]).forEach(function(m){if(m.status.kind==='live')liveList.push(m)})});
 var grouped={};
 matches.forEach(function(m){var L=m.league;if(!grouped[L.id])grouped[L.id]={league:L,matches:[]};grouped[L.id].matches.push(m)});
 var groups=Object.keys(grouped).map(function(k){return grouped[k]}).filter(function(group){return filter==='all'||filter===group.league.id}).sort(function(x,y){return x.league.n.localeCompare(y.league.n)});
 var leagueFilters=LEAGUES.filter(function(L){return matches.some(function(m){return m.league.id===L.id})});
 var allFilters=[{id:'all',n:'All leagues'}].concat(leagueFilters);
 function load(){
  setLoading(true);setError('');
  Promise.all(DAYS.map(function(di){
   var date=utcDate(di.offset);
   return fetch(API+'&date='+encodeURIComponent(date),{headers:{Accept:'application/json'}})
    .then(function(response){if(!response.ok)throw new Error('HTTP '+response.status);return response.json()})
    .then(function(json){var rows=extract(json);if(!Array.isArray(rows))throw new Error('Unexpected API response');return {id:di.id,matches:rows.map(normalizeMatch).filter(Boolean)}})
  }))
  .then(function(results){var next={};results.forEach(function(r){next[r.id]=r.matches});setData(next);setLoading(false)})
  .catch(function(err){setError('Could not load fixtures from SportScore. Please try again shortly.');setLoading(false);console.error('SCORELY fixtures error:',err)})
 }
 useEffect(function(){load();var timer=setInterval(load,60000);return function(){clearInterval(timer)}},[]);
 var liveCards=liveList.map(function(m,i){
  var sides=[m.home,m.away],scores=[m.hs,m.as];
  var rows=sides.map(function(name,side){return h('div',{className:'lt',key:side},h('span',null,h(Crest,{n:name}),name),h('b',null,scores[side]===null?'–':scores[side]))});
  return h('div',{className:'lc',key:(m.slug||m.home+m.away)+i},
   h('div',{style:{display:'flex',justifyContent:'space-between'}},h('small',null,m.competition),h('span',{className:'min'},m.status.label||'LIVE')),rows)
 });
 var dayButtons=DAYS.map(function(di){return h('button',{key:di.id,role:'tab','aria-selected':day===di.id,className:day===di.id?'on':'',onClick:function(){setDay(di.id);setOpen(null);setFilter('all')}},di.label,h('small',null,dateLabel(di.offset)))});
 var filterButtons=allFilters.map(function(L){return h('button',{key:L.id,className:'chip'+(filter===L.id?' on':''),onClick:function(){setFilter(L.id)}},L.n)});
 var leagueCards=groups.map(function(group){
  var L=group.league;
  var rows=group.matches.map(function(m,i){var id=day+L.id+i;return h(Match,{key:id,m:m,open:open===id,onClick:function(){setOpen(open===id?null:id)}})});
  return h('section',{className:'lg',key:L.id},h('div',{className:'lh'},h('span',{className:'fl'}),h('b',null,L.n),h('small',null,L.c)),rows)
 });
 var matchContent;
 if(error){matchContent=h('div',{className:'empty'},error,h('div',{style:{marginTop:14}},h('button',{className:'chip on',onClick:load},'Retry')))}
 else if(loading&&!data[day]){matchContent=h('div',{className:'empty'},'Loading real fixtures…')}
 else if(leagueCards.length){matchContent=h('div',{className:'grid'},leagueCards)}
 else{matchContent=h('div',{className:'empty'},'No matches found for this date or league. Choose another day.')}
 return h('div',{id:'top'},
  h('header',null,h('div',{className:'wrap hb'},h(Logo),
   h('button',{className:'burger','aria-label':'Menu','aria-expanded':menu,onClick:function(){setMenu(!menu)}},'☰'),
   h('nav',{className:menu?'open':'','aria-label':'Main'},['Scores','Fixtures','Tables','News','Teams'].map(function(x,i){return h('a',{key:x,href:'#'+x.toLowerCase(),className:i===0?'on':''},x)})))),
  h('main',{className:'wrap'},
   h('section',{className:'hero'},h('h1',null,'Every Match. Every Moment.'),h('p',null,'Live scores, fixtures and results from the biggest leagues in world football.')),
   h('section',{'aria-label':'Live matches'},
    h('div',{className:'sh'},h('span',{className:'dot'}),h('h2',null,'Live now'),h('small',{style:{color:'var(--mut)'}},liveList.length+' matches')),
    liveCards.length?h('div',{className:'live'},liveCards):h('div',{className:'empty'},loading?'Checking live matches…':'No live matches reported right now.')),
   h('section',{className:'sh',style:{marginTop:30}},h('h2',null,'Matches'),h('small',{style:{color:'var(--mut)',marginLeft:'auto'}},'Data refreshes every 60 seconds')),
   h('div',{className:'bar'},
    h('div',{className:'tabs',role:'tablist'},dayButtons),
    h('div',{className:'chips'},filterButtons)),
   matchContent),
  h('footer',null,h('div',{className:'wrap'},h('span',null,'SCORELY · Every Match. Every Moment.'),h('a',{href:'https://sportscore.com/',target:'_blank',rel:'noopener noreferrer',style:{color:'var(--mut)'}},'Powered by SportScore'))))
}
ReactDOM.createRoot(document.getElementById('root')).render(h(App));
})();
</script>
</body>
</html>
